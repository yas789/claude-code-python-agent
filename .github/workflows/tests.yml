name: Tests

on:
  push:
    branches:
      - main
      - dev
      - "feature/**"
  pull_request:
    branches:
      - main
      - dev

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.19"

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Check lint
        run: uv run --locked ruff check app tests

      - name: Check formatting
        run: uv run --locked ruff format --check app tests

      - name: Check syntax
        run: uv run --locked python -m py_compile app/main.py

      - name: Run tests
        run: uv run --locked python -m unittest discover -s tests -p 'test_*.py'
