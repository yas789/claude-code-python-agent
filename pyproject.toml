[project]
name = "codecrafters-claude-code"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "openai>=2.15.0",
]

[dependency-groups]
dev = ["ruff>=0.15,<0.16"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Removed with the global SDK test stubs in step 3.
"tests/*.py" = ["E402", "F401"]
